name: discover
on:
  schedule:
    - cron: "15 10 * * *"      # daily, ~6am ET
  workflow_dispatch:
concurrency:
  group: scout-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m scout.discover
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PROFILE_TEXT: ${{ secrets.PROFILE_TEXT }}
          CONTACTS_JSON: ${{ secrets.CONTACTS_JSON }}
      - name: commit data + state
        run: |
          git config user.name "climate-scout"
          git config user.email "actions@users.noreply.github.com"
          git add data/ state/
          git diff --cached --quiet || (git commit -m "data: discover" && git pull --rebase && git push)